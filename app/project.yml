# XcodeGen spec. Install xcodegen (`brew install xcodegen`), then run
# `xcodegen generate` here to regenerate PWCBar.xcodeproj from scratch.
name: PWCBar
options:
  bundleIdPrefix: com.shreyans
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

targets:
  PWCBar:
    type: application
    platform: macOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: PWCBar
        LSMinimumSystemVersion: "14.0"
        # Menu-bar-only: no Dock icon, no main window.
        LSUIElement: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shreyans.pwcbar
        PRODUCT_NAME: PWCBar
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_ENTITLEMENTS: Sources/PWCBar.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
